<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header><h1>Login</h1></header>

<main>
    <form th:action="@{/login}" method="post">
        <label for="username">Login:</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>

        <div class="acoes"><button type="submit" class="botao">Entrar</button></div>
    </form>

    <!-- ✅ Alertas de sucesso ou erro -->
    <div th:if="${param.erro}" class="erro"><p>Login ou senha inválidos!</p></div>
    <div th:if="${param.sair}" class="sucesso"><p>Você saiu do sistema. Sessão encerrada.</p></div>
    <div th:if="${param.expirou}" class="erro"><p>Sua sessão expirou. Faça login novamente.</p></div>

    <p class="acoes">Não tem conta? <a th:href="@{/register}">Cadastre-se</a></p>
</main>

<footer>&copy; 2025 Sistema de Cadastro de Produtos de Tecnologia</footer>
</body>
</html>
