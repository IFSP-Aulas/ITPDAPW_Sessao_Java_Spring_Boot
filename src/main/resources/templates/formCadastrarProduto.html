<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Produto</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header><h1>Cadastrar Produto</h1></header>
<nav th:replace="~{fragmentos :: menu}"></nav>

<main>
    <form th:action="@{/cadastrarProduto}" method="post" enctype="multipart/form-data">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao"></textarea>

        <label for="logo">Logo do Produto:</label>
        <input type="file" id="logo" name="logo" accept="image/*">

        <div class="acoes"><button type="submit" class="botao">Cadastrar</button></div>
    </form>

    <!-- ✅ Alertas de sucesso ou erro -->
    <div th:if="${mensagemSucesso}" class="sucesso"><p th:text="${mensagemSucesso}"></p></div>
    <div th:if="${erroProduto}" class="erro"><p th:text="${erroProduto}"></p></div>
</main>

<footer>&copy; 2025 Sistema de Cadastro de Produtos de Tecnologia</footer>
</body>
</html>
