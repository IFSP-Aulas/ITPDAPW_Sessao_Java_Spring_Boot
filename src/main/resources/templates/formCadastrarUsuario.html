<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header><h1>Cadastrar Usuário</h1></header>

<main>
    <form th:action="@{/register}" method="post">
        <label for="username">Login:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>

        <div class="acoes"><button type="submit" class="botao">Cadastrar</button></div>
    </form>

    <!-- ✅ Alertas de sucesso ou erro -->
    <div th:if="${mensagemSucesso}"
         style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                padding: 10px; border-radius: 5px; margin-top: 15px;">
        <p th:text="${mensagemSucesso}"></p>
    </div>

    <div th:if="${erroUsuario}"
         style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
                padding: 10px; border-radius: 5px; margin-top: 15px;">
        <p th:text="${erroUsuario}"></p>
    </div>

    <p class="acoes"><a th:href="@{/login}">Ir para o login</a></p>
</main>

<footer>&copy; 2025 Sistema de Cadastro de Produtos de Tecnologia</footer>
</body>
</html>
