spring.application.name=exemplo_sessao_produto

# Conexão com o MariaDB (o banco é criado automaticamente se não existir)
spring.datasource.url=jdbc:mariadb://localhost:3306/aula_sessao?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tempo de vida da sessão do usuário (após esse tempo sem uso, é preciso logar novamente)
server.servlet.session.timeout=30m

# Upload dos logos dos produtos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads
